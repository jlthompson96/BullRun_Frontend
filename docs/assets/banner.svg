  <style>
    .candle { opacity: 0; animation: rise 9s ease-out infinite; }
    @keyframes rise { 0% { opacity: 0; transform: translateY(8px) } 6% { opacity: 1; transform: translateY(0) } 88% { opacity: 1 } 100% { opacity: 0 } }
    .trend { stroke-dasharray: 900; stroke-dashoffset: 900; animation: draw 9s ease-out infinite; }
    @keyframes draw { 0% { stroke-dashoffset: 900 } 60% { stroke-dashoffset: 0 } 88% { stroke-dashoffset: 0; opacity: 1 } 100% { stroke-dashoffset: 0; opacity: 0 } }
    .pulse { animation: pulse 2.2s ease-in-out infinite; transform-origin: 1150px 70px; }
    @keyframes pulse { 0%,100% { opacity: .35; transform: scale(.8) } 50% { opacity: 1; transform: scale(1.25) } }
    .tape { animation: tape 28s linear infinite; }
    @keyframes tape { from { transform: translateX(0) } to { transform: translateX(-955px) } }
    .bull { animation: bob 5s ease-in-out infinite; transform-origin: 165px 140px; }
    @keyframes bob { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-5px) } }
    @media (prefers-reduced-motion: reduce) { .candle, .trend, .pulse, .tape, .bull { animation: none; opacity: 1; stroke-dashoffset: 0 } }
  </style>
